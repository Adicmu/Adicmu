<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Aditya Vivek. Mission Control. CS at Carnegie Mellon, ICPC World Finals 2026.">
  <style>
    .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace; }
    @keyframes twinkle { 0%,100% { opacity:.12; } 50% { opacity:.85; } }
    .tw1 { animation: twinkle 3.4s ease-in-out infinite; }
    .tw2 { animation: twinkle 4.9s ease-in-out infinite .9s; }
    .tw3 { animation: twinkle 6.3s ease-in-out infinite 2.1s; }
    @keyframes blink { 50% { opacity:0; } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .live { animation: blink 1.7s steps(1) infinite; }
    @media (prefers-reduced-motion: reduce) { .tw1,.tw2,.tw3,.cursor,.live { animation: none; opacity:.6; } }
  </style>
  <defs>
    <radialGradient id="planet" cx="38%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#24406E"/>
      <stop offset="55%" stop-color="#132A4E"/>
      <stop offset="100%" stop-color="#0B1730"/>
    </radialGradient>
  </defs>

  <!-- panel -->
  <rect x="8" y="8" width="984" height="264" rx="18" fill="#060B1A" stroke="#1E2C4A" stroke-width="1.5"/>

  <!-- corner brackets -->
  <g stroke="#2A3B5E" stroke-width="2" fill="none">
    <path d="M 26 40 V 26 H 40"/>
    <path d="M 960 26 H 974 V 40"/>
    <path d="M 974 240 V 254 H 960"/>
    <path d="M 40 254 H 26 V 240"/>
  </g>

  <!-- starfield -->
  <g fill="#C9D6F0">
    <g class="tw1">
      <circle cx="120" cy="46" r="1.4"/><circle cx="342" cy="36" r="1.1"/><circle cx="518" cy="58" r="1.5"/>
      <circle cx="608" cy="212" r="1.2"/><circle cx="700" cy="40" r="1.3"/><circle cx="905" cy="88" r="1.4"/>
      <circle cx="655" cy="140" r="1.1"/><circle cx="875" cy="236" r="1.2"/>
    </g>
    <g class="tw2">
      <circle cx="204" cy="34" r="1.2"/><circle cx="452" cy="44" r="1.3"/><circle cx="560" cy="120" r="1.1"/>
      <circle cx="742" cy="252" r="1.3"/><circle cx="948" cy="150" r="1.2"/><circle cx="628" cy="66" r="1.4"/>
      <circle cx="838" cy="52" r="1.1"/>
    </g>
    <g class="tw3">
      <circle cx="76" cy="238" r="1.2"/><circle cx="280" cy="248" r="1.1"/><circle cx="490" cy="234" r="1.3"/>
      <circle cx="586" cy="176" r="1.0"/><circle cx="920" cy="196" r="1.3"/><circle cx="712" cy="96" r="1.0"/>
      <circle cx="966" cy="52" r="1.1"/>
    </g>
  </g>

  <!-- orbital diagram, right side -->
  <g transform="translate(785,150) rotate(-16)">
    <ellipse cx="0" cy="0" rx="155" ry="58" fill="none" stroke="#33415E" stroke-width="1" stroke-dasharray="3 5"/>
    <ellipse cx="0" cy="0" rx="95" ry="34" fill="none" stroke="#33415E" stroke-width="1" stroke-dasharray="2 6"/>
    <path id="orbit1" d="M 155 0 A 155 58 0 1 0 -155 0 A 155 58 0 1 0 155 0" fill="none" stroke="none"/>
    <path id="orbit2" d="M 95 0 A 95 34 0 1 0 -95 0 A 95 34 0 1 0 95 0" fill="none" stroke="none"/>

    <circle cx="0" cy="0" r="46" fill="url(#planet)" stroke="#2A3B5E" stroke-width="1"/>
    <path d="M -46 0 A 46 46 0 0 1 46 0" fill="none" stroke="#FFB454" stroke-opacity=".28" stroke-width="1.5" transform="rotate(24)"/>

    <!-- satellite on outer orbit -->
    <g>
      <animateMotion dur="16s" repeatCount="indefinite" rotate="auto">
        <mpath href="#orbit1"/>
      </animateMotion>
      <rect x="-5" y="-3.5" width="10" height="7" rx="1.5" fill="#0D1830" stroke="#FFB454" stroke-width="1.4"/>
      <rect x="-15" y="-2" width="7" height="4" rx="1" fill="#FFB454" opacity=".85"/>
      <rect x="8" y="-2" width="7" height="4" rx="1" fill="#FFB454" opacity=".85"/>
      <circle cx="0" cy="0" r="1.4" fill="#FFD9A0"/>
    </g>

    <!-- debris speck on inner orbit, opposite direction -->
    <g>
      <animateMotion dur="9s" repeatCount="indefinite" calcMode="linear" keyPoints="1;0" keyTimes="0;1">
        <mpath href="#orbit2"/>
      </animateMotion>
      <circle cx="0" cy="0" r="2.2" fill="#C9D6F0"/>
    </g>
  </g>

  <!-- left text block -->
  <g class="mono">
    <circle class="live" cx="70" cy="73" r="3.4" fill="#FFB454"/>
    <text x="84" y="78" font-size="12" letter-spacing="3.5" fill="#5B6B8C">ADICMU // MISSION CONTROL</text>

    <text x="64" y="152" font-size="54" font-weight="700" letter-spacing="4" fill="#E6EDF7">ADITYA VIVEK</text>
    <rect x="66" y="168" width="112" height="3" fill="#FFB454"/>

    <text x="64" y="204" font-size="15" letter-spacing="1.5" fill="#9FB0CC">CS @ CARNEGIE MELLON  &#183;  ICPC WORLD FINALS 2026 <tspan class="cursor" fill="#FFB454">&#9612;</tspan></text>

    <text x="936" y="46" text-anchor="end" font-size="11" letter-spacing="2" fill="#5B6B8C">DOHA &#183; 25.29&#176;N 51.53&#176;E</text>
  </g>

  <!-- bottom ruler -->
  <g stroke="#1C2A45" stroke-width="1">
    <line x1="64" y1="252" x2="936" y2="252"/>
    <line x1="112" y1="252" x2="112" y2="246"/><line x1="160" y1="252" x2="160" y2="246"/>
    <line x1="208" y1="252" x2="208" y2="246"/><line x1="256" y1="252" x2="256" y2="246"/>
    <line x1="304" y1="252" x2="304" y2="246"/><line x1="352" y1="252" x2="352" y2="246"/>
    <line x1="400" y1="252" x2="400" y2="246"/><line x1="448" y1="252" x2="448" y2="246"/>
    <line x1="496" y1="252" x2="496" y2="246"/><line x1="544" y1="252" x2="544" y2="246"/>
    <line x1="592" y1="252" x2="592" y2="246"/><line x1="640" y1="252" x2="640" y2="246"/>
    <line x1="688" y1="252" x2="688" y2="246"/><line x1="736" y1="252" x2="736" y2="246"/>
    <line x1="784" y1="252" x2="784" y2="246"/><line x1="832" y1="252" x2="832" y2="246"/>
    <line x1="880" y1="252" x2="880" y2="246"/>
  </g>
  <g class="mono" font-size="9" letter-spacing="1.5" fill="#5B6B8C">
    <text x="64" y="266">SYS NOMINAL</text>
    <text x="936" y="266" text-anchor="end">COMMS OPEN</text>
  </g>
</svg>
