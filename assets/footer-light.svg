<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="1000" height="120" role="img" aria-label="End of transmission.">
  <style>
    .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace; }
    @keyframes twinkle { 0%,100% { opacity:.12; } 50% { opacity:.85; } }
    .tw1 { animation: twinkle 3.8s ease-in-out infinite; }
    .tw2 { animation: twinkle 5.6s ease-in-out infinite 1.4s; }
    @keyframes blink { 50% { opacity:0; } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @media (prefers-reduced-motion: reduce) { .tw1,.tw2,.cursor { animation: none; opacity:.6; } }
  </style>
  <defs>
    <radialGradient id="horizon" cx="50%" cy="100%" r="90%">
      <stop offset="0%" stop-color="#A8C4E8"/>
      <stop offset="70%" stop-color="#C6D8EE"/>
      <stop offset="100%" stop-color="#F8FAFD"/>
    </radialGradient>
    <clipPath id="panelclip"><rect x="8" y="0" width="984" height="112" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#panelclip)">
    <rect x="8" y="0" width="984" height="112" fill="#F8FAFD"/>
    <circle cx="500" cy="470" r="390" fill="url(#horizon)"/>
    <path d="M 110 82 A 390 390 0 0 1 890 82" fill="none" stroke="#C2590C" stroke-opacity=".45" stroke-width="1.5"/>
    <g fill="#8FA5C8">
      <g class="tw1">
        <circle cx="150" cy="34" r="1.3"/><circle cx="420" cy="22" r="1.1"/><circle cx="700" cy="30" r="1.4"/><circle cx="880" cy="46" r="1.1"/>
      </g>
      <g class="tw2">
        <circle cx="260" cy="48" r="1.1"/><circle cx="560" cy="40" r="1.3"/><circle cx="812" cy="24" r="1.2"/><circle cx="96" cy="56" r="1.0"/>
      </g>
    </g>
  </g>
  <rect x="8" y="0" width="984" height="112" rx="18" fill="none" stroke="#D8E2F0" stroke-width="1.5"/>

  <g class="mono">
    <text x="500" y="62" text-anchor="middle" font-size="13" letter-spacing="3" fill="#4E5F7E">// END OF TRANSMISSION <tspan class="cursor" fill="#C2590C">&#9612;</tspan></text>
    <text x="500" y="86" text-anchor="middle" font-size="10" letter-spacing="2" fill="#6B7C9C">SEE YOU IN ORBIT</text>
  </g>
</svg>
